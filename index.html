<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qemu-web</title>
<script src="sw-register.js"></script>
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%231769d1%27/%3E%3Cpath d=%27M4 5l3 3-3 3M8 11h4%27 stroke=%27%23fff%27 fill=none stroke-width=%271.6%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header>
  <h1>qemu-web</h1>
  <span id="msg" class="badge" role="status" aria-live="polite" hidden></span>
  <span class="grow"></span>
  <label>Backend
    <select id="backend">
      <option value="replay">Replay (recording)</option>
      <option value="native">Live (native)</option>
      <option value="wasm">WebAssembly QEMU</option>
    </select>
  </label>
  <button id="theme" type="button" title="Switch light or dark">Theme</button>
</header>

<main>
  <section id="image" class="card">
    <h2>Image</h2>
    <div class="row">
      <input id="file" type="file" accept=".bin,.img,application/octet-stream">
      <input id="url" type="url" placeholder="or a URL (needs CORS)" aria-label="Image URL">
      <button id="load-url" type="button">Fetch</button>
    </div>
    <div class="row">
      <label>Machine <select id="machine"></select></label>
      <label>Variant <input id="variant" size="7" placeholder="t31x"></label>
      <label id="rel-label" hidden>Release <select id="release"></select></label>
      <input id="imgfilter" type="search" placeholder="Filter images" aria-label="Filter images" size="14" hidden>
      <label id="srv-label" hidden>Server image <select id="srvimg"><option value="">(use the file above)</option></select></label>
      <label id="rec-label">Recording <select id="recording"></select></label>
      <label id="speed-label">Replay speed
        <select id="speed"><option value="1">1x</option><option value="2">2x</option><option value="4">4x</option><option value="10">10x</option></select>
      </label>
    </div>
    <div class="row" id="hw-row" hidden>
      <label>Sensor <select id="sensor"></select></label>
      <label>Bus <select id="sensor-bus"><option>i2c0</option><option>i2c1</option><option>i2c2</option></select></label>
      <label>Wi-Fi <select id="wifi"></select></label>
      <label class="wifi-cfg" hidden>SSID <input id="ssid" size="10" value="thingino" maxlength="32"></label>
      <label class="wifi-cfg" hidden>Password <input id="psk" size="12" value="thingino123" maxlength="63"></label>
      <label>Bootrom <input id="bootrom" type="file" accept=".bin,.rom,application/octet-stream"></label>
      <label id="boot-src-label" hidden>Boot from <select id="boot-src"><option value="0xfffffffd">SPI flash</option><option value="0xfffffffc">SD card</option><option value="0xffffffff">USB</option></select></label>
      <button id="bootrom-clear" type="button" hidden>Clear bootrom</button>
    </div>
    <dl id="info"><dt>Image</dt><dd>none loaded</dd></dl>
  </section>

  <section id="controls" class="card">
    <h2>Run</h2>
    <div class="row">
      <button id="start" type="button" class="primary">Start</button>
      <button id="stop" type="button" disabled>Stop</button>
      <button id="reset" type="button" disabled>Reset</button>
    </div>
    <dl class="status">
      <dt>State</dt><dd id="st-state">idle</dd>
      <dt>Elapsed</dt><dd id="st-elapsed">-</dd>
      <dt>Guest time</dt><dd id="st-time">0.000 s</dd>
      <dt>Speed</dt><dd id="st-speed">-</dd>
      <dt>Note</dt><dd id="st-msg">-</dd>
    </dl>
    <ol id="stages"></ol>
  </section>

  <section id="console" class="card">
    <div class="card-head">
      <h2>Console</h2><span class="grow"></span>
      <button id="copy" type="button">Copy</button>
      <button id="save" type="button">Save log</button>
      <button id="clear" type="button">Clear</button>
    </div>
    <div id="term"></div>
  </section>

  <section id="gpio" class="card">
    <div class="card-head">
      <h2>GPIO</h2><span class="grow"></span>
      <span class="legend"><i class="k out"></i>out <i class="k in"></i>in <i class="k irq"></i>irq <i class="k func"></i>function</span>
    </div>
    <div id="pins"></div>
    <p id="pins-empty" class="dim">No pin has changed yet. Click an input pin to drive it (not wired yet).</p>
    <ul id="recent"></ul>
  </section>

  <section id="timeline" class="card">
    <div class="card-head">
      <h2>Timeline</h2><span class="grow"></span>
      <label>Window
        <select id="win"><option value="10">10 s</option><option value="30" selected>30 s</option><option value="120">2 min</option><option value="0">all</option></select>
      </label>
      <label class="chk"><input id="follow" type="checkbox" checked> follow</label>
    </div>
    <div id="tl-wrap"><canvas id="tl"></canvas></div>
  </section>
</main>
<footer>
  <p class="version" id="version-text">
    <a href="https://github.com/thingino/qemu-web" target="_blank" rel="noopener">qemu-web</a>
    <span id="version-num">dev</span>
    · <a href="https://github.com/gtxaspec/qemu/tree/card/wasm-tcg" target="_blank" rel="noopener">QEMU source</a>
  </p>
</footer>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
